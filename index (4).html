<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Облік диванів</title>
<style>
:root{--bg:#e9eeec;--card:#fff;--tx:#18242b;--mu:#5f6f77;--ac:#0f766e;--ok:#15803d;--bad:#b91c1c;--bd:#d3dcd9;--hi:#d89b00;--bl:#2563eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#10181c;--card:#18242b;--tx:#e8eeed;--mu:#93a4aa;--ac:#2dd4bf;--ok:#4ade80;--bad:#f87171;--bd:#2a3a42;--hi:#facc15;--bl:#60a5fa}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input{font:inherit;color:var(--tx)}
button{border:0;border-radius:10px;padding:12px;background:var(--bd);cursor:pointer;font-weight:700}
input{padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--card);min-width:0}
header{position:sticky;top:0;background:var(--bg);padding:8px 10px;z-index:5}
.top{display:flex;gap:8px}
#reg{flex:1;background:var(--ac);color:#fff;font-size:22px;padding:16px}
@media(prefers-color-scheme:dark){#reg{color:#06201d}}
.ic{width:56px;font-size:22px}
#stat{margin-top:8px;padding:8px 10px;background:var(--card);border-radius:10px}
.tw{overflow-x:auto;padding:0 6px 130px}
table{border-collapse:separate;border-spacing:0 4px;width:100%;font-size:13px;white-space:nowrap}
th{color:var(--mu);font-weight:600;padding:2px 6px;text-align:left}
td{padding:10px 6px;background:var(--c);color:var(--ct)}
td:first-child{border-radius:8px 0 0 8px}
td:last-child{border-radius:0 8px 8px 0}
tr.ok{--c:#16a34a;--ct:#fff}
tr.pt{--c:#fde68a;--ct:#2a2200}
tr.op{--c:#ffc800;--ct:#1a1400;font-weight:700}
tr.qu{--c:#3b82f6;--ct:#fff}
tr.rd{--c:#dc2626;--ct:#fff}
.pl{background:#fff;padding:1px 7px;border-radius:6px}.pl.ok{color:#15803d}.pl.bad{color:#b91c1c}
#en{width:100%}
td.l{white-space:normal;min-width:90px;font-weight:700}
.up{padding:4px 8px;font-size:14px;margin:1px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.mu{color:var(--mu)}
footer{position:fixed;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--bd)}
#nw{width:44px;font-size:18px;padding:6px;background:var(--bd)}#nw.on{background:#f59e0b;color:#2a2200}
#nm{flex:1}#nr{width:78px}#ad{background:var(--bl);color:#fff;width:52px;font-size:22px;padding:6px}
#ov{position:fixed;inset:0;background:#0007;z-index:9;display:flex;align-items:flex-end}
#box{background:var(--bg);width:100%;max-height:88%;overflow:auto;border-radius:16px 16px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto}
#box h3{margin:14px 0 6px;font-size:15px}
#box>button,#box>input[type=file]{display:block;width:100%;margin:6px 0}
.sq{display:flex;gap:10px}.sq button{flex:1;aspect-ratio:1.4;font-size:20px}
.li{text-align:left;background:var(--c)!important;color:var(--ct)}
.li small{display:block;font-weight:400;opacity:.8}
.br{display:flex;gap:6px;margin:4px 0}.br input{flex:1}.br button{padding:8px 12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:8px}
.cal div{background:var(--card);border-radius:6px;min-height:44px;padding:3px;font-size:11px}
.cal b{display:block;font-size:12px}.cal .x{background:none}
.big{font-size:40px;font-weight:800;line-height:1.1}
tr{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.hide{display:none!important}
#sg{flex:0 0 100%;display:flex;flex-wrap:wrap;gap:6px;max-height:112px;overflow:auto}#sg:empty{display:none}
.sgb{padding:8px 12px;font-size:14px}.sgb small{font-weight:400;opacity:.7}
</style></head><body>
<header>
 <div class="top"><button class="ic" id="bs">⚙</button><button class="ic" id="bt">%</button><button class="ic" id="bg">🎯</button><button id="reg">Реєстрація</button></div>
 <div id="stat"></div><div id="gl" class="mu" style="padding:2px 4px"></div>
</header>
<div class="tw"><table id="tb"></table></div>
<footer><div id="sg"></div><button id="nw" title="Новий диван: не рахується у %">N</button><input id="nm" placeholder="Назва дивану" autocomplete="off"><input id="nr" type="number" inputmode="decimal" placeholder="хв"><button id="ad">+</button></footer>
<div id="ov" class="hide"><div id="box"></div></div>
<script>
const $=s=>document.querySelector(s),KEY='trk_v2';
let S={models:{},jobs:[],breaks:[{f:'12:30',t:'13:00'}],idle:null,idles:[],end:'',endAt:0};
try{const r=JSON.parse(localStorage.getItem(KEY)||'null');if(r&&Array.isArray(r.jobs))S=Object.assign(S,r)}catch(x){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(x){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const p2=n=>String(n).padStart(2,'0'),dk=t=>{const d=new Date(t);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const tf=t=>new Date(t).toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'});
const dur=ms=>{ms=Math.max(0,Math.round(ms/1e3));const h=Math.floor(ms/3600),m=Math.floor(ms%3600/60);return(h?h+':'+p2(m):m)+':'+p2(ms%60)};
const mins=ms=>Math.round(ms/6e4)+' хв',num=v=>Math.round(v*10)/10;
function brk(day){return S.breaks.filter(b=>b.f&&b.t&&b.t>b.f).map(b=>{const f=new Date(day),t=new Date(day);f.setHours(...b.f.split(':').map(Number),0,0);t.setHours(...b.t.split(':').map(Number),0,0);return[f.getTime(),t.getTime()]})}
function work(s,e){if(e<=s)return 0;let tot=e-s;const d=new Date(s);d.setHours(0,0,0,0);
 for(let t=d.getTime();t<e;t+=864e5)for(const[a,b]of brk(t)){const o=Math.min(e,b)-Math.max(s,a);if(o>0)tot-=o}return tot}
function addWork(s,ms){let t=s;for(let g=0;g<400&&ms>0;g++){const d=new Date(t);d.setHours(0,0,0,0);
 const iv=[...brk(d.getTime()),...brk(d.getTime()+864e5)].sort((a,b)=>a[0]-b[0]);
 const ib=iv.find(([a,b])=>t>=a&&t<b);if(ib){t=ib[1];continue}
 const nx=iv.find(([a])=>a>t);if(!nx||nx[0]-t>=ms)return t+ms;ms-=nx[0]-t;t=nx[0]}return t+ms}
const fact=(j,n=Date.now())=>j.sg.reduce((a,[s,e])=>a+work(s,e??n),0);
const cur=()=>S.jobs.find(j=>j.st==='open');
let SEL=null,LP=null,DN=0,LPT=0;const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);

function autoEnd(){if(!S.end)return;const n=Date.now(),[h,m]=S.end.split(':').map(Number),c=cur();let cl=false,sv=false;
 const at=d=>{const x=new Date(d);x.setHours(h,m,0,0);return x.getTime()};
 let le=at(n);if(le>n){const d=new Date(n);d.setDate(d.getDate()-1);le=at(d)}
 if(le>(S.endAt||0)){S.endAt=le;sv=true}
 if(c){const g=c.sg[c.sg.length-1],d=new Date(g[0]);d.setHours(0,0,0,0);
  for(let i=0;i<400;i++){const e=at(d);if(e>n)break;
   if(e>g[0]){g[1]=e;c.st='part';delete c.ac;S.idle={k:'stop',s:e};cl=true;sv=true;break}
   d.setDate(d.getDate()+1)}}
 if(sv)save();if(cl)closeM()}
const tfr=(t,r)=>{const d=new Date(t);return tf(t)+(dk(t)!==r?' '+p2(d.getDate())+'.'+p2(d.getMonth()+1):'')};
function idleRow(x,r){return `<tr class="rd"><td></td><td></td><td class="l">${x.k==='stop'?'Стоп':'Репейр'}</td><td>—</td><td>${tfr(x.s,r)}</td><td>${x.e?tfr(x.e,r):'<i>триває</i>'}</td><td>${x.e?mins(x.e-x.s):dur(Date.now()-x.s)}</td></tr>`}
function strip(){const n=Date.now(),c=cur();let h;
 if(SEL)h=`Обрано: <b>${SEL.size}</b> <button class="up" data-a="gm">Об'єднати</button> <button class="up" data-a="gx">Скасувати</button> <span class="mu">тапай дивани</span>`;else if(c){const r=c.m*6e4-fact(c,n);h=`У роботі: <b>${esc(c.n)}</b> · ${r>=0?'лишилось <b>'+dur(r)+'</b>':'<span class="bad">понад норму +'+dur(-r)+'</span>'}`}
 else if(S.idle)h=`${S.idle.k==='stop'?'Стоп':'Репейр'}: <b>${dur(n-S.idle.s)}</b>`;
 else h='<span class="mu">Не в роботі</span>';
 {const e=$('#stat');if(e._h!==h){e.innerHTML=h;e._h=h}}{const e=$('#gl'),gt=goalTxt();if(e._h!==gt){e.textContent=gt;e._h=gt}}}
function draw(){strip();const n=Date.now(),td=dk(n);
 const done=S.jobs.filter(j=>j.st==='done'&&dk(j.ce)===td).sort((a,b)=>a.ce-b.ce),op=S.jobs.filter(j=>j.st==='open'),pt=S.jobs.filter(j=>j.st==='part'),q=S.jobs.filter(j=>j.st==='queue');
 let i=0,h='<tr><th></th><th>№</th><th>Назва</th><th>Норма</th><th>Відкрив</th><th>Закрив</th><th>Різниця</th></tr>';
 const row=(c,j,a,o,cl,r)=>`<tr class="${c}"${c==='qu'?' data-q="'+j.id+'"':c==='op'?' data-o="'+j.id+'"':''}><td>${a}</td><td>${++i}</td><td class="l">${j.nc?'<b class="pl">N</b> ':''}${esc(j.n)}</td><td>${j.m}</td><td>${o}</td><td>${cl}</td><td>${r}</td></tr>`;
 const ev=[...done.map(j=>({t:j.ce,j})),...S.idles.filter(x=>x.e&&dk(x.s)===td).map(x=>({t:x.e,x}))].sort((a,b)=>a.t-b.t);
 ev.forEach(o=>{if(o.x){h+=idleRow(o.x,td);return}const j=o.j,f=fact(j),p=f>0?j.m*6e4/f*100:0,d=j.m-f/6e4;h+=row('ok',j,'',tf(j.sg[0][0]),tf(j.ce),`${d>=0?'+':'−'}${num(Math.abs(d))} хв · <b class="pl ${p>=100?'ok':'bad'}">${Math.round(p)}%</b>`)});
 if(S.idle)h+=idleRow(S.idle,td);
 let t=n;
 op.forEach(j=>{const r=j.m*6e4-fact(j,n);t=j.ac>n?j.ac:r>0?addWork(n,r):n;h+=row('op',j,'',tf(j.sg[0][0]),`<i>${tf(t)}</i>${j.ac?' ⏰'+tf(j.ac):''}`,r>0?'лишилось '+dur(r):`<b class="pl bad">+${dur(-r)}</b>`)});
 pt.forEach(j=>h+=row('pt',j,'',tf(j.sg[0][0]),'—','факт '+mins(fact(j,n))));
 q.forEach((j,k)=>{const e=addWork(t,j.m*6e4);h+=row('qu',j,SEL?`<b style="font-size:20px">${SEL.has(j.id)?'☑':'☐'}</b>`:(k?`<button class="up" data-a="up:${j.id}">↑</button>`:'')+`<button class="up" data-a="del:${j.id}">✕</button>`+(j.parts?`<button class="up" data-a="ug:${j.id}">✂</button>`:''),'—',`<i>${tf(e)}</i>`,'');t=e});
 $('#tb').innerHTML=h;}

const modal=h=>{$('#box').innerHTML=h;$('#ov').classList.remove('hide')},closeM=()=>$('#ov').classList.add('hide');
function regBox(){const q=S.jobs.find(j=>j.st==='queue'),pt=S.jobs.filter(j=>j.st==='part');
 modal(`<div class="sq"><button data-a="idle:repair">Репейр</button><button data-a="idle:stop">Стоп</button></div>
 <h3>Незавершені</h3>${pt.length?pt.map(j=>`<button class="li" style="--c:#fde68a;--ct:#2a2200" data-a="job:${j.id}">${esc(j.n)}<small>норма ${j.m} хв · факт ${mins(fact(j))}</small></button>`).join(''):'<p class="mu">Немає</p>'}
 <h3>Наступний у черзі</h3>${q?`<button class="li" style="--c:#3b82f6;--ct:#fff" data-a="job:${q.id}">${esc(q.n)}<small>норма ${q.m} хв</small></button>`:'<p class="mu">Черга порожня</p>'}`)}
function reg(k,v){const c=cur();
 if(k==='idle'&&!c&&S.idle&&S.idle.k===v){closeM();return}
 const run=done=>{const t=Date.now();
  if(c){const s=c.sg[c.sg.length-1];s[1]=t;c.st=done?'done':'part';delete c.ac;if(done)c.ce=t}
  if(S.idle){S.idle.e=t;S.idles.push(S.idle);S.idle=null}
  if(k==='idle')S.idle={k:v,s:t};else{const j=S.jobs.find(x=>x.id===v);if(j){j.sg.push([t,null]);j.st='open'}}
  save();closeM();draw()};
 if(c){modal(`<h3>Зробив «${esc(c.n)}»?</h3><div class="sq"><button id="y" style="background:var(--ok);color:#fff">Так</button><button id="n" style="background:var(--hi);color:#000">Ні</button></div>`);
  $('#y').onclick=()=>run(true);$('#n').onclick=()=>run(false)}else run(false)}
function setBox(){modal(`<button data-a="mdb">База моделей</button><h3>Перерви (не рахуються в час)</h3>${S.breaks.map((b,i)=>`<div class="br"><input type="time" value="${b.f}" data-bf="${i}"><input type="time" value="${b.t}" data-bt="${i}"><button data-a="rb:${i}">✕</button></div>`).join('')}<button data-a="ab">Додати перерву</button>
 <h3>Кінець зміни (авто-стоп)</h3><input type="time" id="en" value="${S.end||''}">
 <h3>Дані</h3><button data-a="ex">Скачати копію</button><input type="file" id="im" accept=".json"><button data-a="ip">Вставити копію з тексту</button><button data-a="wp">Стерти все</button><p id="msg" class="mu"></p>`)}
function autoClose(){const c=cur();if(!c||!c.ac||c.ac>Date.now())return;const t=c.ac,g=c.sg[c.sg.length-1];
 if(g[0]>t){delete c.ac;save();return}
 g[1]=t;c.st='done';c.ce=t;delete c.ac;const nx=S.jobs.find(j=>j.st==='queue');
 if(nx){nx.sg.push([t,null]);nx.st='open'}else S.idle={k:'stop',s:t};save();closeM();draw()}
function acBox(id,msg){const j=S.jobs.find(x=>x.id===id);if(!j||j.st!=='open')return;const d=new Date(j.ac||Date.now());
 modal(`<h3>Автозакриття «${esc(j.n)}»</h3><p class="mu">У цей час диван закриється, відкриється наступний з черги, а якщо черги нема, буде Стоп.</p><input type="time" id="act" value="${p2(d.getHours())}:${p2(d.getMinutes())}" style="width:100%"><button data-a="acs:${id}">Зберегти</button>${j.ac?`<button data-a="acc:${id}">Прибрати автозакриття</button>`:''}<p class="bad">${msg||''}</p>`)}
async function exportFile(name,data){name=name||'dyvany-'+dk(Date.now())+'.json';data=data||JSON.stringify(S);const P=window.Capacitor&&window.Capacitor.Plugins;
 try{if(P&&P.Filesystem&&P.Share){const r=await P.Filesystem.writeFile({path:name,data,directory:'CACHE',encoding:'utf8'});await P.Share.share({title:name,files:[r.uri]});return}}
 catch(x){if(/cancel|dismiss/i.test(String(x&&(x.message||x))))return}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();
 $('#msg').innerHTML='Якщо файл не скачався, скопіюй цей текст:<textarea id="jx" readonly rows="5" style="width:100%"></textarea>';$('#jx').value=data;$('#jx').select()}
function pk(t){const d=typeof t==='string'?(([a,b,c])=>new Date(a,b-1,c))(t.split('-').map(Number)):new Date(t);let y=d.getFullYear(),m=d.getMonth()+1;if(d.getDate()>=26){m++;if(m>12){m=1;y++}}return y+'-'+p2(m)}
function goalBox(msg){const g=S.goal||{p:150};
 modal(`<h3>Ціль на період</h3><p class="mu">Скільки % хочеш мати на кінець періоду (до 25 числа). Підказка радить закрити кожен диван за норма ÷ ціль, тобто в темпі цілі. Запас % не витрачається на один диван.</p><input id="gp" type="number" inputmode="decimal" placeholder="Ціль, %" value="${g.p}" style="width:100%"><button data-a="gs">Зберегти</button>${S.goal?'<button data-a="gc">Вимкнути ціль</button>':''}<p class="bad">${msg||''}</p>`)}
function goalTxt(){const g=S.goal;if(!g)return'';const n=Date.now(),dl=S.jobs.filter(j=>j.st==='done'&&dk(j.ce)===dk(n)&&!j.nc),N=dl.reduce((x,j)=>x+j.m*6e4,0),F=dl.reduce((x,j)=>x+fact(j),0),G=g.p/100,c=cur();
 let s='Ціль: '+g.p+'% · День: '+(F>0?(N/F*100).toFixed(2).replace('.',',')+'%':'—');
 if(!c)return s;
 if(c.nc)return s+' · Закрити поточний: не рахується (N)';
 const tt=c.m/G,rem=tt-fact(c,n)/6e4,df=Math.round(c.m-tt);
 if(rem<=0)return s+' · Закрити поточний: якнайшвидше (час за ціллю вийшов)';
 return s+' · Закрити поточний: '+tf(addWork(n,rem*6e4))+(df>0?' (на '+df+' хв швидше)':df<0?' (на '+(-df)+' хв повільніше)':' (за нормою)')}
function sug(){const q=$('#nm').value.trim().toLowerCase(),b=$('#sg');
 if(!q){SG=[];b.innerHTML='';return}
 const ks=Object.keys(S.models).sort((a,c)=>a.localeCompare(c,'uk')),lc=k=>k.toLowerCase();
 SG=[...ks.filter(k=>lc(k).startsWith(q)),...ks.filter(k=>!lc(k).startsWith(q)&&lc(k).includes(q))].filter(k=>lc(k)!==q).slice(0,8);
 b.innerHTML=SG.map((k,i)=>`<button class="sgb" data-a="pk:${i}">${esc(k)} <small>${S.models[k]} хв</small></button>`).join('')}
function mdbBox(){modal(`<button data-a="bk">← Налаштування</button><h3>База моделей (<span id="mc"></span>)</h3><div class="br"><input id="an" placeholder="Нова модель" autocomplete="off" style="flex:1"><input id="ar" type="number" inputmode="decimal" placeholder="хв" style="flex:0 0 80px"><button data-a="ma">Додати</button></div><button data-a="mxe">Скачати базу</button><input type="file" id="imm" accept=".json"><button data-a="mxp">Вставити базу з тексту</button><p id="msg" class="mu"></p><input id="mq" placeholder="Пошук" autocomplete="off" style="width:100%"><div id="mlist"></div><p class="mu">Нова норма діє для нових диванів. Ті, що вже в черзі, не змінюються.</p>`);fillM()}
function addModel(){const m=$('#msg'),nm=$('#an').value.trim(),mv=parseFloat($('#ar').value);
 if(!nm){m.textContent='Введи назву моделі';return}
 if(!(mv>0)){m.textContent='Введи норму в хвилинах';return}
 const ex=Object.keys(S.models).find(k=>k.toLowerCase()===nm.toLowerCase());
 if(ex){if(S.models[ex]===mv){m.textContent='«'+ex+'» уже є з такою нормою';return}
  if(!confirm('«'+ex+'» уже є з нормою '+S.models[ex]+' хв. Змінити на '+mv+' хв?'))return}
 const k=ex||nm;S.models[k]=mv;save();$('#an').value='';$('#ar').value='';$('#mq').value='';fillM();sug();m.textContent=(ex?'Оновлено: ':'Додано: ')+k+' — '+mv+' хв'}
function impModels(t){const m=$('#msg');let o;
 try{o=JSON.parse(t);if(o&&o.models)o=o.models;if(!o||typeof o!=='object'||Array.isArray(o))throw 0}catch(x){m.textContent='Це не файл бази';return}
 const ks=Object.keys(S.models),add=[],upd=[];
 for(const[n,v]of Object.entries(o)){const nm=String(n).trim(),mv=parseFloat(v);if(!nm||!(mv>0))continue;const lc=nm.toLowerCase(),ex=ks.find(k=>k.toLowerCase()===lc);
  if(!ex){if(!add.some(a=>a[0].toLowerCase()===lc))add.push([nm,mv])}else if(S.models[ex]!==mv)upd.push([ex,mv])}
 if(!add.length&&!upd.length){m.textContent='Нічого нового: усі моделі вже є';return}
 if(!confirm('Нових: '+add.length+(upd.length?', зміниться норма у: '+upd.length:'')+'. Додати до твоєї бази?'))return;
 add.concat(upd).forEach(([k,v])=>{S.models[k]=v});save();fillM();sug();m.textContent='Додано: '+add.length+(upd.length?', оновлено: '+upd.length:'')}
function fillM(){const q=($('#mq').value||'').trim().toLowerCase(),all=Object.keys(S.models);
 MK=all.sort((a,c)=>a.localeCompare(c,'uk')).filter(k=>!q||k.toLowerCase().includes(q));
 $('#mc').textContent=MK.length+(q?' з '+all.length:'');
 $('#mlist').innerHTML=MK.length?MK.map((k,i)=>`<div class="br"><span style="flex:1;align-self:center;font-weight:700">${esc(k)}</span><input type="number" inputmode="decimal" style="flex:0 0 80px" value="${S.models[k]}" data-mn="${i}"><button data-a="md:${i}">✕</button></div>`).join(''):'<p class="mu">Нічого немає</p>'}
function synBox(mk){const a=(S.adj||{})[mk];
 modal(`<button data-a="bk2">← Статистика</button><h3>Звірка з фірмою</h3><p class="mu">Введи % місяця на фірмі, скільки годин у нього входить (орієнтовно: 8 год × дні, мінус стопи/репейр, якщо фірма їх не рахує) і до якої дати фірма враховує дні. Усе, що в програмі після цієї дати, додасться зверху.</p><input id="sp" type="number" inputmode="decimal" placeholder="% на фірмі зараз" style="width:100%"><input id="sh" type="number" inputmode="decimal" placeholder="Годин у цьому %" value="${a?num(a.f/36e5):''}" style="width:100%;margin-top:6px"><p class="mu" style="margin:8px 0 2px">Фірма враховує дні до (включно):</p><input id="su" type="date" value="${a&&a.upto?a.upto:dk(Date.now()-864e5)}" style="width:100%"><button data-a="ssv:${mk}">Зберегти</button><button data-a="scl:${mk}">Прибрати корекцію</button><p id="sm" class="bad"></p>`)}
function histBox(d){const dl=S.jobs.filter(j=>j.st==='done'&&dk(j.ce)===d).sort((a,b)=>a.ce-b.ce);let i=0;
 const dc=dl.filter(j=>!j.nc),T=dc.reduce((a,j)=>a+j.m*6e4,0),F=dc.reduce((a,j)=>a+fact(j),0),[y,m,dd]=d.split('-');
 const ev=[...dl.map(j=>({t:j.ce,j})),...S.idles.filter(x=>x.e&&dk(x.s)===d).map(x=>({t:x.e,x}))].sort((a,b)=>a.t-b.t),
 rows=ev.map(o=>{if(o.x)return idleRow(o.x,d);const j=o.j,f=fact(j),p=f>0?j.m*6e4/f*100:0,df=j.m-f/6e4;return `<tr class="ok" data-h="${j.id}"><td></td><td>${++i}</td><td class="l">${j.nc?'<b class="pl">N</b> ':''}${esc(j.n)}</td><td>${j.m}</td><td>${tf(j.sg[0][0])}</td><td>${tf(j.ce)}</td><td>${df>=0?'+':'−'}${num(Math.abs(df))} хв · <b class="pl ${p>=100?'ok':'bad'}">${p.toFixed(2).replace('.',',')}%</b></td></tr>`}).join('');
 modal(`<button data-a="bk2:${d}">← Статистика</button><h3>Історія ${dd}.${m}.${y} · ${F>0?(T/F*100).toFixed(2).replace('.',',')+'%':'—'}</h3><div style="overflow-x:auto"><table><tr><th></th><th>№</th><th>Назва</th><th>Норма</th><th>Відкрив</th><th>Закрив</th><th>Різниця</th></tr>${rows}</table></div><p class="mu">Затисни диван, щоб змінити «рахується / не рахується»</p>`)}
function ncBox(id){const j=S.jobs.find(x=>x.id===id);if(!j)return;const d=dk(j.ce);
 modal(`<button data-a="hb:${d}">← Історія</button><h3>${esc(j.n)}</h3><p class="mu">Норма ${j.m} хв · факт ${mins(fact(j))}</p><div class="sq"><button data-a="nc1:${id}" style="${j.nc?'':'background:var(--ok);color:#fff'}">Рахується</button><button data-a="nc0:${id}" style="${j.nc?'background:var(--hi);color:#000':''}">Не рахується</button></div>`)}
function statBox(d){d=d||dk(Date.now());const mk=pk(d),[y,m]=mk.split('-').map(Number),dn=S.jobs.filter(j=>j.st==='done'),adj=(S.adj||{})[mk],
 pr=(l,x,dg)=>{l=l.filter(j=>!j.nc);const n=l.reduce((a,j)=>a+j.m*6e4,0)+(x?x.n:0),f=l.reduce((a,j)=>a+fact(j),0)+(x?x.f:0);return f>0?(dg?(n/f*100).toFixed(dg).replace('.',','):Math.round(n/f*100))+'%':'—'},
 mn=(l,x)=>{l=l.filter(j=>!j.nc);return 'норма '+Math.round((l.reduce((a,j)=>a+j.m*6e4,0)+(x?x.n:0))/6e4)+' хв · факт '+Math.round((l.reduce((a,j)=>a+fact(j),0)+(x?x.f:0))/6e4)+' хв'};
 const ml=dn.filter(j=>pk(j.ce)===mk),dl=dn.filter(j=>dk(j.ce)===d).sort((a,b)=>a.ce-b.ce),st=new Date(y,m-2,26),days=Math.round((new Date(y,m-1,25)-st)/864e5)+1;
 let c=['Пн','Вт','Ср','Чт','Пт','Сб','Нд'].map(x=>`<div class="x mu">${x}</div>`).join('')+'<div class="x"></div>'.repeat((st.getDay()+6)%7);
 for(let i=0;i<days;i++){const dt=new Date(st.getFullYear(),st.getMonth(),st.getDate()+i),k=dk(dt),l=dn.filter(j=>dk(j.ce)===k);c+=`<div data-a="go:${k}">${dt.getDate()}${l.length?`<b>${pr(l)}</b>`:''}</div>`}
 modal(`<input type="date" id="sd" value="${d}" style="width:100%"><h3>За день</h3><div class="big">${pr(dl,0,2)}</div><div class="mu">${mn(dl)} · ${dl.length} див.</div>${dl.length?`<button data-a="hist:${d}" style="width:100%;margin-top:6px">Історія дня</button>`:''}<h3>За період ${p2(st.getDate())}.${p2(st.getMonth()+1)}–25.${p2(m)}</h3><div class="big">${pr(ml,adj,2)}</div><div class="mu">${mn(ml,adj)} · ${ml.length} див.</div>${adj?'<div class="mu">у т.ч. корекція: '+num(adj.f/36e5)+' год до програми</div>':''}<button data-a="syn:${mk}" style="width:100%;margin-top:8px">Звірити з фірмою</button><div class="cal">${c}</div>`)}

document.addEventListener('click',e=>{
 if(Date.now()-LPT<700)return;
 if(e.target.id==='ov'){closeM();return}
 if(SEL&&!e.target.closest('[data-a]')){const r=e.target.closest('tr[data-q]');if(r){const i=r.dataset.q;SEL.has(i)?SEL.delete(i):SEL.add(i);draw();strip()}return}
 const b=e.target.closest('[data-a]');if(!b)return;const[k,v]=b.dataset.a.split(':');
 if(k==='idle'||k==='job')reg(k,v);
 else if(k==='up'){const qi=S.jobs.map((j,i)=>j.st==='queue'?i:-1).filter(i=>i>=0),p=qi.findIndex(i=>S.jobs[i].id===v);if(p>0){[S.jobs[qi[p]],S.jobs[qi[p-1]]]=[S.jobs[qi[p-1]],S.jobs[qi[p]]];save();draw()}}
 else if(k==='del'){if(confirm('Прибрати з черги?')){S.jobs=S.jobs.filter(j=>j.id!==v);save();draw()}}
 else if(k==='rb'){S.breaks.splice(+v,1);save();setBox()}
 else if(k==='ab'){S.breaks.push({f:'',t:''});setBox()}
 else if(k==='go')statBox(v);
 else if(k==='ex')exportFile();
 else if(k==='ip'){const t=prompt('Встав текст копії');if(!t)return;try{const j=JSON.parse(t);if(!Array.isArray(j.jobs))throw 0;if(confirm('Замінити поточні дані?')){S=Object.assign({models:{},jobs:[],breaks:[],idle:null,idles:[]},j);save();closeM();draw()}}catch(x){$('#msg').textContent='Це не копія'}}
 else if(k==='syn')synBox(v);
 else if(k==='bk2')statBox(v);
 else if(k==='hist')histBox(v);
 else if(k==='scl'){if(S.adj)delete S.adj[v];save();statBox(v+'-15')}
 else if(k==='ssv'){const P=parseFloat($('#sp').value),H=parseFloat($('#sh').value),U=$('#su').value;if(!(P>0)||!(H>=0)||!U){$('#sm').textContent='Введи % з фірми, години і дату';return}
  const dn=S.jobs.filter(j=>j.st==='done'&&pk(j.ce)===v&&dk(j.ce)<=U&&!j.nc),N=dn.reduce((a,j)=>a+j.m*6e4,0),F=dn.reduce((a,j)=>a+fact(j),0),f=H*36e5;
  (S.adj=S.adj||{})[v]={f,n:P/100*(F+f)-N,upto:U};save();statBox(v+'-15')}
 else if(k==='acs'){const j=S.jobs.find(x=>x.id===v),tv=$('#act').value;if(!j||!tv)return;const[h,m]=tv.split(':').map(Number),d=new Date();d.setHours(h,m,0,0);
  if(d.getTime()<=Date.now()+1e3){acBox(v,'Цей час уже минув');return}j.ac=d.getTime();save();closeM();draw()}
 else if(k==='acc'){const j=S.jobs.find(x=>x.id===v);if(j)delete j.ac;save();closeM();draw()}
 else if(k==='gx'){SEL=null;draw();strip()}
 else if(k==='gm'){const ids=S.jobs.filter(j=>j.st==='queue'&&SEL.has(j.id));if(ids.length<2)return;
  const parts=ids.flatMap(x=>x.parts||[{n:x.n,m:x.m,nc:x.nc}]),at=S.jobs.indexOf(ids[0]);
  S.jobs=S.jobs.filter(j=>!ids.includes(j));
  S.jobs.splice(at,0,{id:uid(),n:parts.map(x=>x.n).join(' + '),m:parts.reduce((a,x)=>a+x.m,0),st:'queue',sg:[],parts,nc:ids.some(x=>x.nc)});
  SEL=null;save();draw();strip()}
 else if(k==='ug'){const j=S.jobs.find(x=>x.id===v);if(j&&j.parts){S.jobs.splice(S.jobs.indexOf(j),1,...j.parts.map(x=>({id:uid(),n:x.n,m:x.m,st:'queue',sg:[],nc:x.nc})));save();draw()}}
 else if(k==='gs'){const p=parseFloat($('#gp').value);if(!(p>0)){goalBox('Введи число');return}S.goal={p};save();closeM();draw();strip()}
 else if(k==='gc'){delete S.goal;save();closeM();draw();strip()}
 else if(k==='mdb')mdbBox();
 else if(k==='bk')setBox();
 else if(k==='hb')histBox(v);
 else if(k==='mxe'){if(!Object.keys(S.models).length){$('#msg').textContent='База порожня';return}exportFile('dyvany-baza-'+dk(Date.now())+'.json',JSON.stringify({type:'models',models:S.models}))}
 else if(k==='ma')addModel();
 else if(k==='mxp'){const t=prompt('Встав текст бази');if(t)impModels(t)}
 else if(k==='nc0'||k==='nc1'){const j=S.jobs.find(x=>x.id===v);if(j){if(k==='nc0')j.nc=true;else delete j.nc;save();histBox(dk(j.ce));draw();strip()}}
 else if(k==='pk'){const n=SG[+v];if(n){$('#nm').value=n;$('#nr').value=S.models[n];sug()}}
 else if(k==='md'){const n=MK[+v];if(n!==undefined&&confirm('Видалити «'+n+'» з бази?')){delete S.models[n];save();fillM();sug()}}
 else if(k==='wp'&&confirm('Стерти ВСІ дані?')){S={models:{},jobs:[],breaks:[],idle:null,idles:[],end:'',endAt:0};save();closeM();draw()}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.bf!==undefined){S.breaks[+t.dataset.bf].f=t.value;save();draw()}
 else if(t.dataset.bt!==undefined){S.breaks[+t.dataset.bt].t=t.value;save();draw()}
 else if(t.dataset.mn!==undefined){const n=MK[+t.dataset.mn],m=parseFloat(t.value);if(n!==undefined){if(m>0){S.models[n]=m;save()}else t.value=S.models[n]}}
 else if(t.id==='en'){S.end=t.value;save()}
 else if(t.id==='imm'&&t.files[0]){const r=new FileReader();r.onload=()=>impModels(r.result);r.readAsText(t.files[0])}
 else if(t.id==='sd'&&t.value)statBox(t.value);
 else if(t.id==='im'&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!Array.isArray(j.jobs))throw 0;if(confirm('Замінити поточні дані файлом?')){S=Object.assign({models:{},jobs:[],breaks:[],idle:null,idles:[]},j);save();closeM();draw()}}catch(x){$('#msg').textContent='Це не файл-копія'}};r.readAsText(t.files[0])}});
document.addEventListener('input',e=>{if(e.target.id==='mq')fillM()});
document.addEventListener('pointerdown',e=>{DN=Date.now();if(SEL)return;const r=e.target.closest('tr[data-q],tr[data-o],tr[data-h]');if(!r||e.target.closest('[data-a]'))return;const q=r.dataset.q,o=r.dataset.o,h=r.dataset.h;clearTimeout(LP);
 LP=setTimeout(()=>{LPT=Date.now();if(navigator.vibrate)navigator.vibrate(30);if(h)ncBox(h);else if(q){SEL=new Set([q]);draw();strip()}else acBox(o)},500)});
['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,()=>{clearTimeout(LP);DN=0}));
document.addEventListener('contextmenu',e=>{if(e.target.closest('.tw,tr[data-h]'))e.preventDefault()});
$('#reg').onclick=regBox;$('#bg').onclick=()=>goalBox();$('#bs').onclick=setBox;$('#bt').onclick=()=>statBox();
$('#nm').oninput=()=>{const k=Object.keys(S.models).find(x=>x.toLowerCase()===$('#nm').value.trim().toLowerCase());if(k)$('#nr').value=S.models[k];sug()};
$('#ad').onclick=()=>{const n=$('#nm').value.trim(),m=parseFloat($('#nr').value);if(!n||!(m>0)){$('#nr').focus();return}
 const k=Object.keys(S.models).find(x=>x.toLowerCase()===n.toLowerCase())||n,nw=$('#nw').classList.contains('on');S.models[k]=m;
 S.jobs.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),n:k,m,st:'queue',sg:[],...(nw?{nc:true}:{})});
 $('#nm').value='';$('#nr').value='';$('#nw').classList.remove('on');sug();save();draw()};
$('#nw').onclick=()=>$('#nw').classList.toggle('on');
autoClose();autoEnd();draw();setInterval(()=>{autoClose();autoEnd();if($('#ov').classList.contains('hide')&&!SEL&&Date.now()-DN>1500)draw();else strip()},1000);
</script></body></html>
