name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Capacitor project
        run: |
          mkdir www
          cp "$(ls index*.html | head -n1)" www/index.html
          npm init -y
        npm i @capacitor/core @capacitor/cli @capacitor/android @capacitor/filesystem @capacitor/share
          npx cap init "Облік диванів" com.mykola.dyvany --web-dir=www
          npx cap add android
          npx cap sync android
      - name: Stable signing
        run: |
          ks=$(ls debug*.keystore 2>/dev/null | head -n1)
          if [ -z "$ks" ]; then echo "НЕМАЄ keystore"; exit 1; fi
          cp "$ks" "$GITHUB_WORKSPACE/stable.keystore"
          cat >> android/app/build.gradle <<EOF

          android {
              signingConfigs {
                  debug {
                      storeFile file('$GITHUB_WORKSPACE/stable.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
          }
          EOF
      - name: Build
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: dyvany-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Fingerprint
        continue-on-error: true
        run: |
          AS=$(ls -d $ANDROID_HOME/build-tools/*/ | tail -n1)apksigner
          $AS verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep SHA-256
