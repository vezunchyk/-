name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Capacitor project
        run: |
          ls -la
          mkdir www
          cp "$(ls index*.html | head -n1)" www/index.html
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Облік диванів" com.mykola.dyvany --web-dir=www
          npx cap add android
          npx cap sync android
      - name: Debug key
        run: |
          mkdir -p ~/.android
          ks=$(ls debug*.keystore 2>/dev/null | head -n1)
          if [ -n "$ks" ]; then
            cp "$ks" ~/.android/debug.keystore
          else
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Build
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: dyvany-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
